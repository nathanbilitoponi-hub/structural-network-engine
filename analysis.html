<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Shared Analysis - Structural Network Engine</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:0;
}

.header{
background:#1d2a3a;
color:white;
padding:16px;
text-align:center;
font-size:18px;
}

.container{
width:1000px;
margin:auto;
margin-top:30px;
}

.box{
background:white;
border-radius:10px;
padding:20px;
margin-bottom:25px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #e3e6ee;
padding:10px;
}

th{
background:#f2f5fb;
}

svg{
background:white;
border:1px solid #ddd;
}

.download a{
display:block;
margin-bottom:8px;
color:#2b7cff;
text-decoration:none;
}

.download a:hover{
text-decoration:underline;
}

.footer{
text-align:center;
margin-top:30px;
color:#666;
font-size:14px;
}

</style>

</head>

<body>

<div class="header">
Structural Network Engine — Shared Analysis
</div>

<div class="container">

<div class="box">

<div class="title">Analysis Info</div>

<div><b>Analysis ID:</b> <span id="jobId"></span></div>
<div><b>Date:</b> <span id="jobDate"></span></div>
<div><b>Input File:</b> <span id="jobInput"></span></div>

</div>


<div class="box">

<div class="title">Results</div>

<table>
<tbody id="resultsTable">

<tr>
<th>Status</th>
<td>Loading analysis...</td>
</tr>

</tbody>
</table>

</div>


<div class="box download">

<div class="title">Download</div>

<a id="downloadNodes">Nodes CSV</a>
<a id="downloadEdges">Edges CSV</a>
<a id="downloadReport">Report JSON</a>

</div>


<div class="box">

<div class="title">Network Graph</div>

<svg id="graph" width="600" height="400"></svg>

</div>

</div>

<div class="footer">
Generated by Structural Network Engine
</div>

<script>

let simulation=null


function getJobId(){

const parts=window.location.pathname.split("/")

return parts[2]

}


async function loadAnalysis(){

const id=getJobId()

if(!id){

alert("Invalid analysis link")
return

}

const res=await fetch("/public/job/"+id)

const data=await res.json()

if(!res.ok){

alert("Analysis not found")
return

}

renderJob(data)
renderResults(data)
drawGraph(data.nodes,data.links)

}


function renderJob(data){

document.getElementById("jobId").innerText=data.job_id
document.getElementById("jobDate").innerText=data.created_at
document.getElementById("jobInput").innerText=data.input_file

document.getElementById("downloadNodes").href=data.downloads.nodes
document.getElementById("downloadEdges").href=data.downloads.edges
document.getElementById("downloadReport").href=data.downloads.report

}


function renderResults(data){

const m=data.metrics

const rows=[

["File",m.file],
["Rows",m.rows],
["Columns",m.columns],
["Valid Points",m.valid_points],
["Network Sample",m.network_sample],
["Edges",m.edges],
["Mean Degree",m.mean_degree],
["Max Degree",m.max_degree],
["Components",m.components],
["Backbone Nodes",m.backbone_nodes]

]

const tbody=document.getElementById("resultsTable")

tbody.innerHTML=""

rows.forEach(r=>{

const tr=document.createElement("tr")

const th=document.createElement("th")
th.innerText=r[0]

const td=document.createElement("td")
td.innerText=r[1]

tr.appendChild(th)
tr.appendChild(td)

tbody.appendChild(tr)

})

}


function drawGraph(nodes,links){

const svg=d3.select("#graph")

svg.selectAll("*").remove()

if(simulation)simulation.stop()

simulation=d3.forceSimulation(nodes)
.force("link",d3.forceLink(links).id(d=>d.id).distance(40))
.force("charge",d3.forceManyBody().strength(-90))
.force("center",d3.forceCenter(300,200))

const link=svg.append("g")
.selectAll("line")
.data(links)
.enter()
.append("line")
.attr("stroke","#aaa")

const node=svg.append("g")
.selectAll("circle")
.data(nodes)
.enter()
.append("circle")
.attr("r",d=>d.backbone?6:4)
.attr("fill",d=>d.backbone?"#ff6b35":"#2b7cff")

simulation.on("tick",()=>{

link
.attr("x1",d=>d.source.x)
.attr("y1",d=>d.source.y)
.attr("x2",d=>d.target.x)
.attr("y2",d=>d.target.y)

node
.attr("cx",d=>d.x)
.attr("cy",d=>d.y)

})

}


loadAnalysis()

</script>

</body>
</html>
